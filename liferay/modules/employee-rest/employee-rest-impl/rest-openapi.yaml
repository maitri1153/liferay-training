info:
    description: "EmployeeRest REST API"
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: "EmployeeRest"
    version: v1.0
openapi: 3.0.1
paths:
  "/get-employeeDetail":
    get:
      operationId: getEmployeeDetailById
      parameters:
        - in: query
          name: employeeId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: "Success Response"
          content:
            application/json:
              schema:
                  $ref: "#/components/schemas/EmployeeDetailObject"
            application/xml:
              schema:
                  $ref: "#/components/schemas/EmployeeDetailObject"
      tags: ["EmployeeDetail"]
  "/update-employeeDetail":
    post:
      operationId: updateEmployeeDetail
      requestBody:
        content:
           application/json:
             schema:
                 $ref: "#/components/schemas/EmployeeDetailObject"
           application/xml:
             schema:
                 $ref: "#/components/schemas/EmployeeDetailObject"
      responses:
        200:
          description: "Success Response"
          content:
            application/json:
              schema:
                  $ref: "#/components/schemas/EmployeeDetailObject"
            application/xml:
              schema:
                  $ref: "#/components/schemas/EmployeeDetailObject"
      tags: ["EmployeeDetail"]
  "/delete-employee":
    delete:
      operationId: deleteEmployeeDetailById
      parameters:
        - in: query
          name: employeeID
          required: true
          schema:
             type: integer
             format: int64
      responses:
       200:
        description: "Success Response"
        content:
           application/json:
              schema:
                  $ref: "#/components/schemas/EmployeeDetailObject"
           application/xml:
              schema:
                  $ref: "#/components/schemas/EmployeeDetailObject"
      tags: ["EmployeeDetail"]
  "/get-EmployeeDetails":
    get:
      operationId: getEmployees
      parameters:
        - in: query
          name: page
          schema:
              type: integer
        - in: query
          name: pageSize
          schema:
              type: integer
      responses:
       200:
        description: "Success Response"
        content:
           application/json:
             schema:
               items:
                 $ref: "#/components/schemas/EmployeeDetailObject"
           application/xml:
             schema: 
               items:   
                 $ref: "#/components/schemas/EmployeeDetailObject"
      tags: ["EmployeeDetail"]
components:
  schemas:
    EmployeeDetailObject:
      properties:
        employeeId:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phoneNumber:
          type: integer        
          format: int64
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        zipCode:
          type: integer
          format: int64
        designation:
          type: string